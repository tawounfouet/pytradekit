name: Release

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - src/pytradekit/__init__.py
      - LICENSE
      - CHANGELOG.md
      - README.md
      - docs/releases/**
      - scripts/qualify_release.py
      - examples/**
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    name: Publish versioned release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read package version
        id: version
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Read release title
        id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TITLE="$(python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          path = Path("docs") / "releases" / f"{version}.md"
          lines = path.read_text(encoding="utf-8").splitlines()
          if not lines or not lines[0].startswith("# "):
              raise SystemExit("Release notes must start with a Markdown H1 title.")
          print(lines[0][2:])
          PY
          )"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Check release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tooling
        if: steps.state.outputs.exists != 'true'
        run: python -m pip install --upgrade build

      - name: Requalify release candidate
        if: steps.state.outputs.exists != 'true'
        run: python scripts/qualify_release.py

      - name: Build release artifacts
        if: steps.state.outputs.exists != 'true'
        run: python -m build

      - name: Generate SHA-256 manifest
        if: steps.state.outputs.exists != 'true'
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        if: steps.state.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          PRERELEASE_FLAG=""
          case "$VERSION" in
            *a*|*b*|*rc*) PRERELEASE_FLAG="--prerelease" ;;
          esac

          gh release create "$TAG" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes-file "docs/releases/$VERSION.md" \
            $PRERELEASE_FLAG
