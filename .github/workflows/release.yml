name: Release

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - src/pytradekit/__init__.py
      - LICENSE
      - docs/releases/**
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    name: Publish versioned release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read package version
        id: version
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tooling
        if: steps.state.outputs.exists != 'true'
        run: python -m pip install --upgrade build

      - name: Build release artifacts
        if: steps.state.outputs.exists != 'true'
        run: python -m build

      - name: Generate SHA-256 manifest
        if: steps.state.outputs.exists != 'true'
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        if: steps.state.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG"             dist/*.whl             dist/*.tar.gz             dist/SHA256SUMS             --target "${{ github.sha }}"             --title "PyTradeKit $VERSION - Domain Foundations"             --notes-file "docs/releases/$VERSION.md"
