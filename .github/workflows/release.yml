name: Release

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - src/pytradekit/__init__.py
      - LICENSE
      - CHANGELOG.md
      - README.md
      - docs/releases/**
      - scripts/qualify_release.py
      - examples/**
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    name: Publish versioned release
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pytradekit_test
          POSTGRES_USER: pytradekit
          POSTGRES_PASSWORD: pytradekit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pytradekit -d pytradekit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTRADEKIT_TEST_DATABASE_URL: postgresql+psycopg://pytradekit:pytradekit@localhost:5432/pytradekit_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read package version
        id: version
        run: |
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Read release title
        id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TITLE="$(python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          path = Path("docs") / "releases" / f"{version}.md"
          lines = path.read_text(encoding="utf-8").splitlines()
          if not lines or not lines[0].startswith("# "):
              raise SystemExit("Release notes must start with a Markdown H1 title.")
          print(lines[0][2:])
          PY
          )"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Check release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install package and qualification dependencies
        if: steps.state.outputs.exists != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres,alpaca]"

      - name: Typography policy
        if: steps.state.outputs.exists != 'true'
        run: python scripts/check_typography.py

      - name: Ruff
        if: steps.state.outputs.exists != 'true'
        run: ruff check .

      - name: Typecheck
        if: steps.state.outputs.exists != 'true'
        run: mypy src tests scripts examples

      - name: Import architecture contracts
        if: steps.state.outputs.exists != 'true'
        run: lint-imports

      - name: Architecture and public import tests
        if: steps.state.outputs.exists != 'true'
        run: pytest tests/architecture tests/contracts

      - name: Production fault qualification
        if: steps.state.outputs.exists != 'true'
        run: |
          pytest \
            tests/unit/runtime/test_operations.py \
            tests/unit/runtime/test_observability.py \
            tests/unit/runtime/test_qualification.py \
            tests/qualification \
            tests/integration/test_alpaca_production_faults.py \
            tests/integration/test_alpaca_startup_restart_reconciliation.py

      - name: Unit, property, and integration tests
        if: steps.state.outputs.exists != 'true'
        run: pytest --cov=pytradekit --cov-report=term-missing

      - name: Requalify release artifacts
        if: steps.state.outputs.exists != 'true'
        run: python scripts/qualify_release.py

      - name: Build release artifacts
        if: steps.state.outputs.exists != 'true'
        run: python -m build

      - name: Generate SHA-256 manifest
        if: steps.state.outputs.exists != 'true'
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        if: steps.state.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
        run: |
          PRERELEASE_FLAG=""
          case "$VERSION" in
            *a*|*b*|*rc*) PRERELEASE_FLAG="--prerelease" ;;
          esac

          gh release create "$TAG" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes-file "docs/releases/$VERSION.md" \
            $PRERELEASE_FLAG
