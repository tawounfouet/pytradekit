name: IBKR Real PAPER Certification

on:
  workflow_dispatch:
    inputs:
      deterministic_ci_run_id:
        description: Successful CI run ID for this exact commit
        required: true
      contract_id:
        description: IBKR conId for the controlled US equity probe
        required: true
        default: "265598"
      symbol:
        description: Symbol matching the contract ID
        required: true
        default: AAPL
      limit_price:
        description: Explicit safe PAPER LIMIT price for the cancel scenario
        required: true
      quantity:
        description: Controlled PAPER share quantity
        required: true
        default: "1"
      client_id:
        description: Dedicated non-zero IBKR API client ID
        required: true
        default: "71"
      acknowledgement:
        description: Type I_UNDERSTAND_IBKR_PAPER_ORDERS_WILL_BE_CREATED
        required: true

permissions:
  actions: read
  contents: read

jobs:
  real-paper:
    name: Real IBKR PAPER evidence
    runs-on: [self-hosted, macOS, ibkr-paper]

    env:
      PYTRADEKIT_IBKR_EXPECTED_ACCOUNT_ID: ${{ secrets.PYTRADEKIT_IBKR_EXPECTED_ACCOUNT_ID }}
      PYTRADEKIT_IBKR_SURFACE: TWS
      PYTRADEKIT_IBKR_HOST: 127.0.0.1
      PYTRADEKIT_IBKR_PORT: "7497"
      PYTRADEKIT_IBKR_CLIENT_ID: ${{ inputs.client_id }}
      PYTRADEKIT_IBKR_ORDER_PROBE_ACK: ${{ inputs.acknowledgement }}
      PYTRADEKIT_IBKR_ORDER_PROBE_SYMBOL: ${{ inputs.symbol }}
      PYTRADEKIT_IBKR_ORDER_PROBE_CONID: ${{ inputs.contract_id }}
      PYTRADEKIT_IBKR_LIMIT_PRICE: ${{ inputs.limit_price }}
      PYTRADEKIT_IBKR_ORDER_PROBE_QUANTITY: ${{ inputs.quantity }}
      PYTRADEKIT_IBKR_ORDER_PROBE_TIMEOUT_SECONDS: "90"

    steps:
      - name: Verify explicit PAPER order acknowledgement
        shell: bash
        run: |
          set -euo pipefail
          expected="I_UNDERSTAND_IBKR_PAPER_ORDERS_WILL_BE_CREATED"
          if [ "${PYTRADEKIT_IBKR_ORDER_PROBE_ACK}" != "${expected}" ]; then
            echo "::error::Explicit PAPER order acknowledgement is invalid"
            exit 1
          fi
          if [ -z "${PYTRADEKIT_IBKR_EXPECTED_ACCOUNT_ID:-}" ]; then
            echo "::error::PYTRADEKIT_IBKR_EXPECTED_ACCOUNT_ID is not configured"
            exit 1
          fi

      - name: Checkout selected certification candidate
        uses: actions/checkout@v4

      - name: Verify deterministic CI belongs to this commit
        uses: actions/github-script@v7
        with:
          script: |
            const runId = Number("${{ inputs.deterministic_ci_run_id }}");
            if (!Number.isInteger(runId) || runId <= 0) {
              core.setFailed("deterministic_ci_run_id must be a positive integer");
              return;
            }
            const response = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const run = response.data;
            if (run.head_sha !== context.sha) {
              core.setFailed(
                "CI run head_sha " + run.head_sha + " does not match " + context.sha
              );
              return;
            }
            if (run.conclusion !== "success") {
              core.setFailed(
                "CI run conclusion is " + run.conclusion + ", expected success"
              );
              return;
            }
            if (run.name !== "CI") {
              core.setFailed(
                "Workflow name is " + run.name + ", expected CI"
              );
              return;
            }
            if (run.path !== ".github/workflows/ci.yml") {
              core.setFailed(
                "Workflow path is " + run.path + ", expected .github/workflows/ci.yml"
              );
            }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install IBKR qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ibkr]"

      - name: Run controlled real IBKR PAPER adapter probe
        run: |
          mkdir -p artifacts/qualification/brokers/ibkr
          python scripts/ibkr_paper_controlled_probe.py \
            --with-orders \
            --ci-qualified \
            --runbook-reviewed \
            --output artifacts/qualification/brokers/ibkr/real-paper-probe.json

      - name: Retain raw PAPER provider evidence
        id: provider_evidence
        uses: actions/upload-artifact@v4
        with:
          name: pytradekit-ibkr-paper-provider-evidence-${{ github.run_id }}
          path: artifacts/qualification/brokers/ibkr/real-paper-probe.json
          if-no-files-found: error

      - name: Normalize retained PAPER evidence
        run: |
          python scripts/normalize_ibkr_paper_evidence.py \
            --probe-report artifacts/qualification/brokers/ibkr/real-paper-probe.json \
            --qualified-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --deterministic-ci-run-id "${{ inputs.deterministic_ci_run_id }}" \
            --artifact-name "pytradekit-ibkr-paper-provider-evidence-${GITHUB_RUN_ID}" \
            --artifact-id "${{ steps.provider_evidence.outputs.artifact-id }}" \
            --output artifacts/qualification/brokers/ibkr/real-paper-evidence.json

      - name: Replay retained evidence through the compliance harness
        run: |
          python scripts/qualify_ibkr_0_8_compliance.py \
            --commit-sha "$GITHUB_SHA" \
            --paper-evidence artifacts/qualification/brokers/ibkr/real-paper-evidence.json \
            --output artifacts/qualification/brokers/ibkr/real-paper-certification.json

      - name: Upload sanitized IBKR PAPER evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytradekit-ibkr-paper-certification
          path: artifacts/qualification/brokers/ibkr/*.json
          if-no-files-found: warn
