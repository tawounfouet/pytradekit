name: v0.5.0 Real PAPER Requalification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-paper:
    name: Real Alpaca PAPER gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pytradekit
          POSTGRES_USER: pytradekit
          POSTGRES_PASSWORD: pytradekit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pytradekit -d pytradekit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTRADEKIT_RUNTIME_ENVIRONMENT: PAPER
      PYTRADEKIT_ALPACA_EXPECTED_ACCOUNT_ID: ${{ secrets.PYTRADEKIT_ALPACA_EXPECTED_ACCOUNT_ID }}
      PYTRADEKIT_ALPACA_PAPER_API_KEY: ${{ secrets.PYTRADEKIT_ALPACA_PAPER_API_KEY }}
      PYTRADEKIT_ALPACA_PAPER_SECRET_KEY: ${{ secrets.PYTRADEKIT_ALPACA_PAPER_SECRET_KEY }}
      PYTRADEKIT_DATABASE_URL: postgresql+psycopg://pytradekit:pytradekit@localhost:5432/pytradekit
      PYTRADEKIT_QUALIFICATION_ACCOUNT_ID: 00000000-0000-4000-8000-000000000501
      PYTRADEKIT_QUALIFICATION_INSTRUMENT_ID: 00000000-0000-4000-8000-000000000502
      PYTRADEKIT_ALPACA_ORDER_PROBE_SYMBOL: AAPL
      PYTRADEKIT_ALPACA_DATA_FEED: iex
      PYTRADEKIT_ALPACA_ORDER_PROBE_ACK: I_UNDERSTAND_PAPER_ORDERS_WILL_BE_CREATED

    steps:
      - name: Checkout frozen 0.5 behavior candidate
        uses: actions/checkout@v4
        with:
          ref: a7768911b56bb25a7efd24aae12f3cb032a5c9ef

      - name: Verify PAPER secrets are configured
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            PYTRADEKIT_ALPACA_EXPECTED_ACCOUNT_ID \
            PYTRADEKIT_ALPACA_PAPER_API_KEY \
            PYTRADEKIT_ALPACA_PAPER_SECRET_KEY
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is not configured"
              missing=1
            else
              echo "${name}=PRESENT"
            fi
          done
          exit "${missing}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install qualification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres,alpaca]"

      - name: Apply PostgreSQL migrations
        run: alembic upgrade head

      - name: Run real Alpaca PAPER qualification
        run: |
          mkdir -p artifacts/qualification
          python scripts/alpaca_paper_v050_qualification.py \
            --with-orders \
            --ci-qualified \
            --runbook-reviewed \
            --output artifacts/qualification/v050-paper.json

      - name: Enforce v0.5.0 release gate
        run: |
          python scripts/check_v050_release_gate.py \
            artifacts/qualification/v050-paper.json

      - name: Upload sanitized qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytradekit-v050-paper-qualification
          path: artifacts/qualification/v050-paper.json
          if-no-files-found: warn
