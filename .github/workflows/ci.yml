name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.12 quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Typography policy
        run: python scripts/check_typography.py

      - name: Ruff
        run: ruff check .

      - name: Typecheck
        run: mypy src tests scripts

      - name: Unit and bootstrap tests
        run: pytest --cov=pytradekit --cov-report=term-missing

      - name: Build wheel and sdist
        run: python -m build
