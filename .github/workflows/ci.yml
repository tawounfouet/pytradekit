name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.12 quality gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pytradekit_test
          POSTGRES_USER: pytradekit
          POSTGRES_PASSWORD: pytradekit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pytradekit -d pytradekit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTRADEKIT_TEST_DATABASE_URL: postgresql+psycopg://pytradekit:pytradekit@localhost:5432/pytradekit_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres,alpaca,ibkr]"

      - name: Typography policy
        run: python scripts/check_typography.py

      - name: Ruff
        run: ruff check .

      - name: Typecheck
        run: mypy src tests scripts examples

      - name: Import architecture contracts
        run: lint-imports

      - name: Architecture and public import tests
        run: pytest tests/architecture tests/contracts

      - name: Production fault qualification
        run: |
          pytest             tests/unit/runtime/test_operations.py             tests/unit/runtime/test_observability.py             tests/unit/runtime/test_qualification.py             tests/qualification             tests/integration/test_alpaca_production_faults.py             tests/integration/test_alpaca_startup_restart_reconciliation.py

      - name: 0.7 production qualification
        run: |
          pytest \
            tests/qualification/security_operations \
            tests/e2e/test_security_authorization.py \
            tests/e2e/test_safety_gate.py \
            tests/e2e/test_safety_governance.py \
            tests/e2e/test_operational_health.py \
            tests/e2e/test_operations_observability.py \
            tests/e2e/test_secret_provider_outage.py \
            tests/property/security \
            tests/property/safety \
            tests/property/operations \
            tests/integration/test_security_repositories.py \
            tests/integration/test_safety_governance_repositories.py \
            tests/integration/test_security_operations_production_qualification.py
          python scripts/qualify_0_7.py

      - name: 0.8 LOT-01 broker compliance qualification
        run: |
          pytest \
            tests/unit/brokers/compliance \
            tests/contracts/brokers/compliance \
            tests/architecture/test_broker_compliance_boundaries.py

      - name: 0.8 LOT-02 compliance evidence qualification
        run: |
          pytest \
            tests/unit/brokers/compliance \
            tests/contracts/brokers/compliance \
            tests/architecture/test_broker_compliance_boundaries.py \
            tests/architecture/test_broker_compliance_evidence.py \
            tests/qualification/broker_compliance

      - name: 0.8 LOT-03 Alpaca compliance certification
        run: |
          pytest \
            tests/unit/brokers/adapters/alpaca/test_compliance.py \
            tests/unit/brokers/adapters/alpaca/test_compliance_evidence.py \
            tests/contracts/brokers/alpaca/test_alpaca_compliance_public_contract.py \
            tests/architecture/test_alpaca_compliance_certification.py \
            tests/qualification/brokers/alpaca
          mkdir -p artifacts/qualification/brokers/alpaca
          python scripts/qualify_alpaca_0_8.py \
            --evidence-record docs/qualification/evidence/alpaca/v050-paper-20261022.json \
            --output artifacts/qualification/brokers/alpaca/compliance-run.json

      - name: 0.8 LOT-04 IBKR discovery contract freeze
        run: |
          pytest \
            tests/unit/brokers/adapters/ibkr/test_discovery.py \
            tests/contracts/brokers/ibkr/test_ibkr_discovery_public_contract.py \
            tests/architecture/test_ibkr_contract_freeze.py \
            tests/qualification/brokers/ibkr
          mkdir -p artifacts/qualification/brokers/ibkr
          python scripts/qualify_ibkr_0_8_discovery.py \
            --output artifacts/qualification/brokers/ibkr/contract-freeze.json

      - name: 0.8 LOT-05.1 IBKR provider identity model
        run: |
          pytest \
            tests/unit/brokers/adapters/ibkr/test_identities.py \
            tests/unit/brokers/adapters/ibkr/test_identity_registry.py \
            tests/contracts/brokers/ibkr/test_ibkr_identity_public_contract.py \
            tests/architecture/test_ibkr_identity_boundaries.py \
            tests/qualification/brokers/ibkr/test_ibkr_identity_model.py
          mkdir -p artifacts/qualification/brokers/ibkr
          python scripts/qualify_ibkr_0_8_identities.py \
            --output artifacts/qualification/brokers/ibkr/identity-model.json

      - name: 0.8 LOT-05.2 IBKR contract and instrument mapping
        run: |
          pytest \
            tests/unit/brokers/adapters/ibkr/test_contract_mapping.py \
            tests/contracts/brokers/ibkr/test_ibkr_contract_mapping_public_contract.py \
            tests/architecture/test_ibkr_contract_mapping_boundaries.py \
            tests/qualification/brokers/ibkr/test_ibkr_contract_instrument_mapping.py
          mkdir -p artifacts/qualification/brokers/ibkr
          python scripts/qualify_ibkr_0_8_contract_mapping.py \
            --output artifacts/qualification/brokers/ibkr/contract-instrument-mapping.json

      - name: 0.8 LOT-05.3 IBKR order command mapping
        run: |
          pytest \
            tests/unit/brokers/adapters/ibkr/test_order_commands.py \
            tests/contracts/brokers/ibkr/test_ibkr_order_command_public_contract.py \
            tests/architecture/test_ibkr_order_command_boundaries.py \
            tests/qualification/brokers/ibkr/test_ibkr_order_command_mapping.py
          mkdir -p artifacts/qualification/brokers/ibkr
          python scripts/qualify_ibkr_0_8_order_commands.py \
            --output artifacts/qualification/brokers/ibkr/order-command-mapping.json

      - name: 0.8 LOT-05.4 IBKR order callback normalization
        run: |
          pytest \
            tests/unit/brokers/adapters/ibkr/test_order_callbacks.py \
            tests/contracts/brokers/ibkr/test_ibkr_order_callback_public_contract.py \
            tests/architecture/test_ibkr_order_callback_boundaries.py \
            tests/qualification/brokers/ibkr/test_ibkr_order_callback_normalization.py
          mkdir -p artifacts/qualification/brokers/ibkr
          python scripts/qualify_ibkr_0_8_order_callbacks.py \
            --output artifacts/qualification/brokers/ibkr/order-callback-normalization.json

      - name: 0.8 LOT-05.5 IBKR execution details and Fill mapping
        run: |
          pytest \
            tests/unit/brokers/adapters/ibkr/test_execution_mapping.py \
            tests/contracts/brokers/ibkr/test_ibkr_execution_mapping_public_contract.py \
            tests/architecture/test_ibkr_execution_mapping_boundaries.py \
            tests/qualification/brokers/ibkr/test_ibkr_execution_details_mapping.py
          mkdir -p artifacts/qualification/brokers/ibkr
          python scripts/qualify_ibkr_0_8_executions.py \
            --output artifacts/qualification/brokers/ibkr/execution-fill-mapping.json

      - name: 0.8 LOT-05.6 IBKR account and position mapping
        run: |
          pytest \
            tests/unit/brokers/adapters/ibkr/test_account_mapping.py \
            tests/contracts/brokers/ibkr/test_ibkr_account_mapping_public_contract.py \
            tests/architecture/test_ibkr_account_mapping_boundaries.py \
            tests/qualification/brokers/ibkr/test_ibkr_account_position_mapping.py
          mkdir -p artifacts/qualification/brokers/ibkr
          python scripts/qualify_ibkr_0_8_accounts.py \
            --output artifacts/qualification/brokers/ibkr/account-position-mapping.json

      - name: 0.8 LOT-05.7 IBKR error taxonomy, readiness and capability manifest
        run: |
          pytest \
            tests/unit/brokers/adapters/ibkr/test_error_readiness.py \
            tests/contracts/brokers/ibkr/test_ibkr_error_readiness_public_contract.py \
            tests/architecture/test_ibkr_error_readiness_boundaries.py \
            tests/qualification/brokers/ibkr/test_ibkr_error_readiness_capability.py
          mkdir -p artifacts/qualification/brokers/ibkr
          python scripts/qualify_ibkr_0_8_error_readiness.py \
            --output artifacts/qualification/brokers/ibkr/error-readiness-capability.json

      - name: 0.8 LOT-06.1 IBKR PAPER connection runtime
        run: |
          pytest \
            tests/unit/brokers/adapters/ibkr/test_ibkr_paper_runtime.py \
            tests/contracts/brokers/ibkr/test_ibkr_runtime_public_contract.py \
            tests/architecture/test_ibkr_runtime_boundaries.py \
            tests/qualification/brokers/ibkr/test_ibkr_paper_connection_runtime.py
          python -c "from importlib.metadata import version; assert version('ib_async') == '2.1.0'"
          mkdir -p artifacts/qualification/brokers/ibkr
          python scripts/qualify_ibkr_0_8_paper_connection.py \
            --output artifacts/qualification/brokers/ibkr/paper-connection-runtime.json

      - name: Unit, property, and integration tests
        run: pytest --cov=pytradekit --cov-report=term-missing

      - name: Single-node deployment qualification
        run: |
          python scripts/qualify_deployment.py
          docker build --tag pytradekit:ci .

      - name: Release artifact qualification
        run: python scripts/qualify_release.py
