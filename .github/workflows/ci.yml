name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.12 quality gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pytradekit_test
          POSTGRES_USER: pytradekit
          POSTGRES_PASSWORD: pytradekit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pytradekit -d pytradekit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTRADEKIT_TEST_DATABASE_URL: postgresql+psycopg://pytradekit:pytradekit@localhost:5432/pytradekit_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres,alpaca]"

      - name: Typography policy
        run: python scripts/check_typography.py

      - name: Ruff
        run: ruff check .

      - name: Typecheck
        run: mypy src tests scripts examples

      - name: Import architecture contracts
        run: lint-imports

      - name: Architecture and public import tests
        run: pytest tests/architecture tests/contracts

      - name: Production fault qualification
        run: |
          pytest             tests/unit/runtime/test_operations.py             tests/unit/runtime/test_observability.py             tests/unit/runtime/test_qualification.py             tests/qualification             tests/integration/test_alpaca_production_faults.py             tests/integration/test_alpaca_startup_restart_reconciliation.py

      - name: 0.7 production qualification
        run: |
          pytest \
            tests/qualification/security_operations \
            tests/e2e/test_security_authorization.py \
            tests/e2e/test_safety_gate.py \
            tests/e2e/test_safety_governance.py \
            tests/e2e/test_operational_health.py \
            tests/e2e/test_operations_observability.py \
            tests/e2e/test_secret_provider_outage.py \
            tests/property/security \
            tests/property/safety \
            tests/property/operations \
            tests/integration/test_security_repositories.py \
            tests/integration/test_safety_governance_repositories.py \
            tests/integration/test_security_operations_production_qualification.py
          python scripts/qualify_0_7.py

      - name: 0.8 LOT-01 broker compliance qualification
        run: |
          pytest \
            tests/unit/brokers/compliance \
            tests/contracts/brokers/compliance \
            tests/architecture/test_broker_compliance_boundaries.py

      - name: 0.8 LOT-02 compliance evidence qualification
        run: |
          pytest \
            tests/unit/brokers/compliance \
            tests/contracts/brokers/compliance \
            tests/architecture/test_broker_compliance_boundaries.py \
            tests/architecture/test_broker_compliance_evidence.py \
            tests/qualification/broker_compliance

      - name: 0.8 LOT-03 Alpaca compliance certification
        run: |
          pytest \
            tests/unit/brokers/adapters/alpaca/test_compliance.py \
            tests/unit/brokers/adapters/alpaca/test_compliance_evidence.py \
            tests/contracts/brokers/alpaca/test_alpaca_compliance_public_contract.py \
            tests/architecture/test_alpaca_compliance_certification.py \
            tests/qualification/brokers/alpaca
          mkdir -p artifacts/qualification/brokers/alpaca
          python scripts/qualify_alpaca_0_8.py \
            --evidence-record docs/qualification/evidence/alpaca/v050-paper-20261022.json \
            --output artifacts/qualification/brokers/alpaca/compliance-run.json

      - name: Unit, property, and integration tests
        run: pytest --cov=pytradekit --cov-report=term-missing

      - name: Single-node deployment qualification
        run: |
          python scripts/qualify_deployment.py
          docker build --tag pytradekit:ci .

      - name: Release artifact qualification
        run: python scripts/qualify_release.py
