name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.12 quality gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pytradekit_test
          POSTGRES_USER: pytradekit
          POSTGRES_PASSWORD: pytradekit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pytradekit -d pytradekit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTRADEKIT_TEST_DATABASE_URL: postgresql+psycopg://pytradekit:pytradekit@localhost:5432/pytradekit_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres,alpaca]"

      - name: Typography policy
        run: python scripts/check_typography.py

      - name: Ruff
        run: ruff check .

      - name: Typecheck
        run: mypy src tests scripts examples

      - name: Import architecture contracts
        run: lint-imports

      - name: Architecture and public import tests
        run: pytest tests/architecture tests/contracts

      - name: Production fault qualification
        run: |
          pytest             tests/unit/runtime/test_operations.py             tests/unit/runtime/test_observability.py             tests/unit/runtime/test_qualification.py             tests/qualification             tests/integration/test_alpaca_production_faults.py             tests/integration/test_alpaca_startup_restart_reconciliation.py

      - name: Unit, property, and integration tests
        run: pytest --cov=pytradekit --cov-report=term-missing

      - name: Release artifact qualification
        run: python scripts/qualify_release.py
