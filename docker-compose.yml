services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pytradekit
      POSTGRES_USER: pytradekit
      POSTGRES_PASSWORD: pytradekit
    ports:
      - "5432:5432"
    volumes:
      - pytradekit_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pytradekit -d pytradekit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pytradekit_postgres:
