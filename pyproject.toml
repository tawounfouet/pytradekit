[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytradekit"
version = "0.8.0b5"
description = "Domain-first, broker-agnostic trading framework."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Thomas AWOUNFOUET" }]
license = "Apache-2.0"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
postgres = ["SQLAlchemy>=2.0,<3", "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4"]
alpaca = ["alpaca-py==0.44.0"]
ibkr = ["ib_async==2.1.0"]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "hypothesis>=6.115",
  "import-linter>=2.1",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
]

[project.scripts]
pytradekit = "pytradekit.__main__:main"

[project.urls]
Repository = "https://github.com/tawounfouet/pytradekit"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pytradekit = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true

[tool.coverage.run]
branch = true
source = ["pytradekit"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.importlinter]
root_package = "pytradekit"

[[tool.importlinter.contracts]]
name = "Shared Kernel is independent"
type = "forbidden"
source_modules = ["pytradekit.shared"]
forbidden_modules = ["pytradekit.reference", "pytradekit.runtime", "pytradekit.testing"]

[[tool.importlinter.contracts]]
name = "Reference domain is infrastructure independent"
type = "forbidden"
source_modules = ["pytradekit.reference.domain"]
forbidden_modules = ["pytradekit.runtime", "pytradekit.testing"]

[[tool.importlinter.contracts]]
name = "Runtime ports do not depend on adapters"
type = "forbidden"
source_modules = ["pytradekit.runtime.ports"]
forbidden_modules = ["pytradekit.runtime.adapters"]

[[tool.importlinter.contracts]]
name = "Strategy domain is broker independent"
type = "forbidden"
source_modules = ["pytradekit.strategy.domain"]
forbidden_modules = ["pytradekit.brokers", "pytradekit.backtesting.adapters"]

[[tool.importlinter.contracts]]
name = "Market data domain is strategy and broker independent"
type = "forbidden"
source_modules = ["pytradekit.market_data.domain"]
forbidden_modules = ["pytradekit.strategy", "pytradekit.brokers"]

[[tool.importlinter.contracts]]
name = "Reconciliation domain is provider independent"
type = "forbidden"
source_modules = ["pytradekit.reconciliation.domain"]
forbidden_modules = ["pytradekit.brokers.adapters", "pytradekit.persistence"]


[[tool.importlinter.contracts]]
name = "Security domain is infrastructure and provider independent"
type = "forbidden"
source_modules = ["pytradekit.security.domain"]
forbidden_modules = ["pytradekit.brokers", "pytradekit.persistence"]


[[tool.importlinter.contracts]]
name = "Safety domain is provider independent"
type = "forbidden"
source_modules = ["pytradekit.safety.domain"]
forbidden_modules = ["pytradekit.brokers", "pytradekit.persistence"]


[[tool.importlinter.contracts]]
name = "Operations domain is trading aggregate independent"
type = "forbidden"
source_modules = ["pytradekit.operations.domain"]
forbidden_modules = [
  "pytradekit.orders",
  "pytradekit.portfolio",
  "pytradekit.risk",
  "pytradekit.brokers",
  "pytradekit.persistence",
]


[[tool.importlinter.contracts]]
name = "Broker compliance core is provider independent"
type = "forbidden"
source_modules = ["pytradekit.brokers.compliance"]
forbidden_modules = ["pytradekit.brokers.adapters"]
